<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<meta name="color-scheme" content="dark">
<title>Painel SEO · Montador de Móveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ═════════ TOKENS — mesma identidade do painel original ═════════ */
:root{
  --bg:#050508;
  --surface:rgba(14,14,28,.95);
  --surface-2:rgba(232,232,230,.05);
  --ink:#e8e8e6;
  --ink-2:rgba(232,232,230,.55);
  --ink-3:rgba(232,232,230,.35);
  --line:rgba(232,232,230,.08);
  --line-2:rgba(232,232,230,.16);

  --copper:#bf00ff;
  --copper-dim:rgba(191,0,255,.15);
  --copper-glow:rgba(191,0,255,.3);

  --ok:#2ecc71;    --ok-dim:rgba(46,204,113,.12);
  --run:#bf00ff;   --run-dim:rgba(191,0,255,.14);
  --late:#e74c3c;  --late-dim:rgba(231,76,60,.12);
  --plan:#f39c12;  --plan-dim:rgba(243,156,18,.12);
  --none:rgba(232,232,230,.35); --none-dim:rgba(232,232,230,.06);

  --font-hero:'Bebas Neue', Impact, sans-serif;
  --font-mono:'Space Mono', ui-monospace, monospace;
  --font-body:'Rajdhani', system-ui, sans-serif;

  --pad:20px;
  --tabbar:calc(60px + env(safe-area-inset-bottom));
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-weight:400; font-size:16px; line-height:1.5;
  min-height:100dvh; overflow-x:hidden;
  padding-bottom:calc(var(--tabbar) + 8px);
}
body::before{
  content:''; position:fixed; inset:0; z-index:9999; pointer-events:none; opacity:.35;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}
body::after{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 70% 15%, rgba(15,20,60,.3) 0%, transparent 65%),
    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(5,8,30,.25) 0%, transparent 60%);
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:var(--copper);text-decoration:none}
::selection{background:var(--copper);color:#050508}

/* rótulo mono — usado em toda a interface */
.mono{font-family:var(--font-mono);letter-spacing:.15em;text-transform:uppercase}

.wrap{width:100%;max-width:1400px;margin:0 auto;padding:0 var(--pad)}

/* ═════════ TOPO ═════════ */
.topbar{
  position:sticky; top:0; z-index:60;
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.topbar-in{display:flex;align-items:center;gap:12px;height:58px}
.mark{
  min-width:28px;height:28px;flex:0 0 auto;padding:0 7px;border-radius:6px;
  background:var(--copper);color:#050508;
  display:grid;place-items:center;
  font-family:var(--font-hero);font-size:.9rem;letter-spacing:.08em;white-space:nowrap;
}
.top-titles{min-width:0;flex:1}
.top-title{
  font-family:var(--font-hero);font-size:1.05rem;letter-spacing:.12em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.top-sub{
  font-family:var(--font-mono);font-size:.5rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;border-radius:8px;
  border:1px solid var(--line);background:transparent;
  display:grid;place-items:center;color:var(--ink-3);transition:.3s;
}
.icon-btn:hover{border-color:var(--copper);color:var(--copper)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═════════ VIEWS ═════════ */
.view{display:none;padding-top:26px;animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ═════════ HERO ═════════ */
.hero{margin-bottom:30px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--font-mono);font-size:.55rem;letter-spacing:.25em;text-transform:uppercase;
  color:var(--copper);margin-bottom:12px;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--copper);flex:0 0 6px}
.dot.live{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
h1{
  font-family:var(--font-hero);font-size:clamp(2.4rem,10vw,4rem);
  letter-spacing:.04em;line-height:1;margin-bottom:14px;font-weight:400;
}
.hero-desc{font-size:1rem;font-weight:300;color:var(--ink-2);max-width:700px;line-height:1.6}

/* ═════════ CARDS ═════════ */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:22px;margin-bottom:16px;transition:border-color .3s ease;
}
.card:hover{border-color:var(--line-2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.card-title{
  font-family:var(--font-mono);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:12px;
}
.card-title::before{content:'';width:22px;height:2px;background:var(--copper);flex:0 0 22px}
.card-meta{font-family:var(--font-mono);font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

/* ═════════ PROGRESSO ═════════ */
.prog{display:flex;align-items:center;gap:22px}
.ring{width:104px;height:104px;flex:0 0 104px;position:relative}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bgc{stroke:rgba(232,232,230,.06)}
.ring .fgc{stroke:var(--copper);filter:drop-shadow(0 0 6px var(--copper-glow));transition:stroke-dasharray 1.5s cubic-bezier(.16,1,.3,1)}
.ring-val{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-hero);font-size:1.9rem;color:var(--copper);letter-spacing:.02em;
}
.prog-info{min-width:0;flex:1}
.prog-big{font-size:1.05rem;font-weight:600;margin-bottom:4px}
.prog-small{font-family:var(--font-mono);font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.segbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(232,232,230,.06);gap:2px}
.segbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:16px}
.legend span{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--font-mono);font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
}
.legend i{width:8px;height:8px;border-radius:2px;display:block}

/* ═════════ STATS ═════════ */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;
  transition:border-color .3s ease, transform .3s ease;
}
.stat:hover{border-color:var(--line-2);transform:translateY(-2px)}
.stat b{display:block;font-family:var(--font-hero);font-size:2.2rem;letter-spacing:.02em;line-height:1;font-weight:400}
.stat span{
  display:block;font-family:var(--font-mono);font-size:.52rem;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);margin-top:8px;
}
.stat.acc b{color:var(--copper)}
.stat.ok b{color:var(--ok)}
.stat.late b{color:var(--late)}
.stat.run b{color:var(--run)}

/* ═════════ ALERTA ═════════ */
.alert{
  display:flex;gap:14px;align-items:flex-start;position:relative;overflow:hidden;
  background:var(--surface);border:1px solid rgba(231,76,60,.2);
  border-radius:12px;padding:18px;margin-bottom:16px;
}
.alert::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:var(--late);opacity:.7}
.alert svg{width:17px;height:17px;flex:0 0 17px;stroke:var(--late);fill:none;stroke-width:1.8;stroke-linecap:round;margin-top:2px}
.alert-t{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--late)}
.alert-d{font-size:.9rem;font-weight:300;color:var(--ink-2);margin-top:5px}

/* ═════════ LINHAS ═════════ */
.rows{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:14px 0;border-bottom:1px solid var(--line);min-height:58px;transition:opacity .2s;
}
.row:last-child{border-bottom:none;padding-bottom:0}
.row:first-child{padding-top:0}
.row:hover{opacity:.75}
.row-date{
  flex:0 0 46px;text-align:center;border-radius:6px;padding:6px 0;
  background:var(--none-dim);border:1px solid var(--line);
}
.row-date b{display:block;font-family:var(--font-hero);font-size:1.25rem;line-height:1;letter-spacing:.02em;color:var(--copper);font-weight:400}
.row-date span{display:block;font-family:var(--font-mono);font-size:.45rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.row-date.late{background:var(--late-dim);border-color:rgba(231,76,60,.25)}
.row-date.late b{color:var(--late)}
.row-body{min-width:0;flex:1}
.row-name{
  font-size:.95rem;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.row-sub{
  font-family:var(--font-mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-tail{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.chev{width:14px;height:14px;stroke:var(--ink-3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--font-mono);font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 10px;border-radius:4px;white-space:nowrap;
}
.pill.ok{background:var(--ok-dim);color:var(--ok);border:1px solid rgba(46,204,113,.2)}
.pill.late{background:var(--late-dim);color:var(--late);border:1px solid rgba(231,76,60,.2)}
.pill.run{background:var(--run-dim);color:var(--run);border:1px solid rgba(191,0,255,.25)}
.pill.plan{background:var(--plan-dim);color:var(--plan);border:1px solid rgba(243,156,18,.2)}
.pill.none{background:var(--none-dim);color:var(--ink-3);border:1px solid var(--line)}

/* ═════════ COLUNAS (RESUMO) ═════════ */
.col-item{padding:15px 0;border-bottom:1px solid var(--line)}
.col-item:last-child{border-bottom:none;padding-bottom:0}
.col-item:first-child{padding-top:0}
.col-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.col-name{font-size:.92rem;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-num{font-family:var(--font-mono);font-size:.52rem;letter-spacing:.1em;color:var(--ink-3);flex:0 0 auto}
.bar{height:4px;border-radius:2px;background:rgba(232,232,230,.06);overflow:hidden}
.bar i{
  display:block;height:100%;border-radius:2px;width:0;
  background:linear-gradient(90deg, var(--copper), #e8c87a);
  transition:width 1.5s cubic-bezier(.16,1,.3,1);
}

/* ═════════ BOTÕES ═════════ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  min-height:54px;border-radius:8px;
  background:var(--copper-dim);border:1px solid var(--copper);color:var(--copper);
  font-family:var(--font-mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
  transition:.3s;margin-bottom:16px;
}
.btn:hover{background:rgba(191,0,255,.22);box-shadow:0 0 24px rgba(191,0,255,.18)}
.btn:active{transform:scale(.985)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink-3)}
.btn.ghost:hover{border-color:var(--copper);color:var(--copper);box-shadow:none}

/* ═════════ BUSCA + FILTROS ═════════ */
.tools{
  position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:50;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  margin:0 calc(var(--pad) * -1);padding:12px var(--pad) 10px;
  border-bottom:1px solid var(--line);
}
.search{position:relative;margin-bottom:10px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.8;stroke-linecap:round}
.search input{
  width:100%;height:46px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:0 42px 0 40px;font-size:.95rem;font-weight:400;outline:none;transition:.3s;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:var(--copper);box-shadow:0 0 0 3px var(--copper-dim)}
.search .clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:none;place-items:center;border-radius:6px;color:var(--ink-3)}
.search .clear.on{display:grid}
.search .clear svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:9px 16px;border-radius:6px;
  border:1px solid var(--line);background:transparent;color:var(--ink-3);
  font-family:var(--font-mono);font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;
  white-space:nowrap;transition:.3s;
}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--copper-dim);border-color:var(--copper);color:var(--copper)}
.chip b{margin-left:6px;opacity:.7;font-weight:400}

/* ═════════ SEGMENTED ═════════ */
.seg{display:flex;gap:8px;margin:20px 0;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:1 0 auto;min-width:96px;min-height:40px;border-radius:6px;
  border:1px solid var(--line);background:transparent;color:var(--ink-3);
  font-family:var(--font-mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;transition:.3s;
}
.seg button:hover{border-color:var(--line-2);color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--copper-dim);border-color:var(--copper);color:var(--copper)}

/* ═════════ ACORDEÃO DE ETAPAS ═════════ */
.acc{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  margin-bottom:14px;overflow:hidden;transition:border-color .3s ease;
}
.acc.open{border-color:var(--line-2)}
.acc-head{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;min-height:68px}
.acc-idx{
  flex:0 0 auto;font-family:var(--font-hero);font-size:1.8rem;line-height:1;
  color:var(--copper);opacity:.4;letter-spacing:.02em;min-width:40px;
}
.acc.open .acc-idx{opacity:1}
.acc-t{min-width:0;flex:1}
.acc-name{font-size:1.05rem;font-weight:600;line-height:1.25}
.acc-sub{font-family:var(--font-mono);font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.acc-arrow{
  width:26px;height:26px;flex:0 0 26px;padding:6px;border:1px solid var(--line);border-radius:50%;
  stroke:var(--ink-3);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:.3s;
}
.acc.open .acc-arrow{transform:rotate(180deg);border-color:var(--copper);stroke:var(--copper)}
.acc-body{display:none;padding:0 18px 8px}
.acc.open .acc-body{display:block}
.acc-bar{height:2px;background:rgba(232,232,230,.06)}
.acc-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--copper),#e8c87a);transition:width 1.5s cubic-bezier(.16,1,.3,1)}

/* ═════════ TAREFA ═════════ */
.task{display:flex;gap:14px;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--line);min-height:58px;transition:opacity .2s}
.task:last-child{border-bottom:none}
.task:hover{opacity:.8}
.task-mark{
  flex:0 0 26px;height:26px;border-radius:6px;margin-top:1px;position:relative;
  background:var(--none-dim);border:1px solid var(--line);
}
.task-mark::after{
  content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;
  transform:translate(-50%,-50%);background:var(--ink-3);
}
.task-mark.ok{background:var(--ok-dim);border-color:rgba(46,204,113,.3)}
.task-mark.ok::after{
  left:8px;top:5px;width:5px;height:10px;border:solid var(--ok);border-width:0 2px 2px 0;
  border-radius:0;background:none;transform:rotate(45deg);
}
.task-mark.late{background:var(--late-dim);border-color:rgba(231,76,60,.3)}
.task-mark.late::after{background:var(--late)}
.task-mark.run{background:var(--run-dim);border-color:rgba(191,0,255,.3)}
.task-mark.run::after{background:var(--copper);box-shadow:0 0 8px var(--copper-glow)}
.task-mark.plan{background:var(--plan-dim);border-color:rgba(243,156,18,.25)}
.task-mark.plan::after{background:var(--plan)}
.task-b{min-width:0;flex:1}
.task-name{font-size:.95rem;font-weight:600;line-height:1.4}
.task-name.done{color:var(--ink-2);text-decoration:line-through;text-decoration-color:rgba(46,204,113,.4)}
.task-desc{
  font-size:.82rem;font-weight:300;color:rgba(232,232,230,.4);margin-top:5px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.task-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.tag{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-mono);font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 10px;border-radius:4px;
  background:var(--none-dim);border:1px solid var(--line);color:var(--ink-2);
  max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tag i{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.mini{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-mono);font-size:.5rem;letter-spacing:.1em;color:var(--copper);
}
.mini svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mini.late{color:var(--late)}
.mini.ok{color:var(--ok)}

/* ═════════ CRONOGRAMA ═════════ */
.tl-month{
  position:sticky;top:calc(58px + 112px + env(safe-area-inset-top));z-index:20;
  background:var(--bg);padding:18px 0 10px;
  font-family:var(--font-hero);font-size:1.3rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
}
.tl-list{position:relative;padding-left:28px}
.tl-list::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl-item{position:relative;padding:12px 0;width:100%;text-align:left;display:block;transition:opacity .2s}
.tl-item:hover{opacity:.8}
.tl-item::before{

<script>
/* ╔═══════════════════════════════════════════════════════════════════════╗

   ╚═══════════════════════════════════════════════════════════════════════╝ */

const PROJETO = 'Yi0dumYl';

/* Dá também para trocar sem mexer no código, pela URL:
   index.html?p=5yFFzlKE      (o parâmetro ?p= tem prioridade sobre a linha acima) */


/* ─── Ajustes opcionais (tudo funciona em branco) ─────────────────────────── */
const CONFIG = {
  // Credenciais Trello — gere em https://trello.com/power-ups/admin
  apiKey: 'a70ac6cdf4a0479e97acf7d5976362d3',
  token : 'ATTA52739b85baef2ee0dd5bccea18da6df885e1d6f436b8aff2165b737050ac80ab372D3C95',

  marca:     'BB',     // sigla do quadradinho no topo

/* ═══════════════ Daqui para baixo não precisa mexer em nada ═══════════════ */

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const HOJE = new Date(); HOJE.setHours(0,0,0,0);
const DIA = 86400000;

const S = { dados:null, view:'resumo', tab:'quadro', q:'', filtro:'todos', etiqueta:null, abertas:new Set() };

const STATUS = {
  ok  :{ rot:'Concluído',    cls:'ok',   cor:'var(--ok)'   },
  late:{ rot:'Atrasado',     cls:'late', cor:'var(--late)' },

  plan:{ rot:'Planejado',    cls:'plan', cor:'var(--plan)' },
  none:{ rot:'Sem data',     cls:'none', cor:'var(--none)' },
};
const ORDEM_STATUS = ['ok','run','late','plan','none'];

/* Cores nativas das etiquetas do Trello (só para o pontinho colorido) */
const COR_TRELLO = {
  green:'#61bd4f', yellow:'#f2d600', orange:'#ff9f1a', red:'#eb5a46', purple:'#c377e0',
  blue:'#0079bf', sky:'#00c2e0', lime:'#51e898', pink:'#ff80ce', black:'#4d4d4d',
  green_light:'#7bc86c', yellow_light:'#f5dd29', orange_light:'#ffaf3f', red_light:'#ef7564',
  purple_light:'#cd8de5', blue_light:'#5ba4cf', sky_light:'#29cce5', lime_light:'#6deca9',

  green_dark:'#519839', yellow_dark:'#d9b51c', orange_dark:'#d29034', red_dark:'#b04632',
  purple_dark:'#89609e', blue_dark:'#055a8c', sky_dark:'#0098b7', lime_dark:'#4bbf6b',
  pink_dark:'#c9558f', black_dark:'#4d4d4d',
};
const corEtiqueta = c => COR_TRELLO[c] || 'var(--gray)';

/* ═════════════ UTILITÁRIOS ═════════════ */
function extrairId(v){
  v = String(v || '').trim();
  const m = v.match(/trello\.com\/b\/([A-Za-z0-9]+)/i);
  if (m) return m[1];
  return v.replace(/[^A-Za-z0-9]/g, '');
}
function idAtual(){
  const p = new URLSearchParams(location.search);
  return extrairId(p.get('p') || p.get('quadro') || p.get('board') || PROJETO);
}
function dataBR(d){
  if (!d) return null;
  return new Date(d).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function diaMes(d){
  const x = new Date(d);
  return { dia:String(x.getDate()).padStart(2,'0'),
           mes:x.toLocaleDateString('pt-BR',{month:'short'}).replace('.','') };
}
function mesAno(d){
  return new Date(d).toLocaleDateString('pt-BR',{ month:'long', year:'numeric' });
}
function diasAte(d){ return Math.round((new Date(d).setHours(0,0,0,0) - HOJE) / DIA); }
function textoPrazo(d){
  const n = diasAte(d);
  if (n === 0)  return 'Hoje';
  if (n === 1)  return 'Amanhã';
  if (n === -1) return 'Ontem';
  if (n < 0)    return Math.abs(n) + ' dias em atraso';
  if (n <= 30)  return 'Em ' + n + ' dias';
  return dataBR(d);
}
function limpo(t){
  return String(t || '').replace(/[#*_`>]/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\s+/g,' ').trim();
}
function plural(n, um, muitos){ return n + ' ' + (n === 1 ? um : muitos); }

/* Markdown simples → HTML (Trello aceita markdown nas descrições) */
function md(txt){
  if (!txt) return '';
  const guard = [];
  let s = esc(txt).replace(/\r\n/g,'\n');

  s = s.replace(/```([\s\S]*?)```/g, (m,c) => {
    guard.push('<pre><code>' + c.replace(/^\n|\n$/g,'') + '</code></pre>');
    return '\u0001' + (guard.length-1) + '\u0001';
  });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (m,t,u) => {
    guard.push('<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>');
    return '\u0001' + (guard.length-1) + '\u0001';
  });
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m,p,u) =>
    p + '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

  const linhas = s.split('\n');
  let out = '', lista = null, buf = [];
  const fechaP = () => { if (buf.length){ out += '<p>' + buf.join('<br>') + '</p>'; buf = []; } };
  const fechaL = () => { if (lista){ out += '</' + lista + '>'; lista = null; } };

  for (const bruta of linhas){
    const l = bruta.trim();
    if (!l){ fechaP(); fechaL(); continue; }
    if (/^-{3,}$/.test(l) || /^={3,}$/.test(l)){ fechaP(); fechaL(); out += '<hr>'; continue; }
    const h = l.match(/^#{1,6}\s+(.*)$/);
    if (h){ fechaP(); fechaL(); out += '<h3>' + h[1] + '</h3>'; continue; }
    const ul = l.match(/^[-*+]\s+(.*)$/);
    if (ul){ fechaP(); if (lista !== 'ul'){ fechaL(); out += '<ul>'; lista = 'ul'; } out += '<li>' + ul[1] + '</li>'; continue; }
    const ol = l.match(/^\d+[.)]\s+(.*)$/);
    if (ol){ fechaP(); if (lista !== 'ol'){ fechaL(); out += '<ol>'; lista = 'ol'; } out += '<li>' + ol[1] + '</li>'; continue; }
    fechaL(); buf.push(l);
  }
  fechaP(); fechaL();
  return out.replace(/\u0001(\d+)\u0001/g, (m,i) => guard[+i]);
}

/* ═════════════ API TRELLO ═════════════ */
async function api(caminho, params){
  const qs = new URLSearchParams(Object.assign({ key:CONFIG.apiKey, token:CONFIG.token }, params || {}));
  const r = await fetch('https://api.trello.com/1' + caminho + '?' + qs.toString());
  if (!r.ok){
    const e = new Error('HTTP ' + r.status);
    e.status = r.status;
    e.corpo = await r.text().catch(() => '');
    throw e;
  }
  return r.json();
}

function boot(txt){ $('#boot').classList.remove('off'); $('#boot-txt').textContent = txt; }
function falhar(msg, codigo){
  $('#boot').classList.add('off');
  $('#fail').classList.remove('off');
  $('#fail-msg').textContent = msg;
  const c = $('#fail-code');
  c.hidden = !codigo;
  if (codigo) c.textContent = codigo;
  $('#fail-input').value = idAtual();
}

async function carregar(){
  const id = idAtual();
  if (!id) return falhar('Nenhum quadro configurado. Cole o ID (ou o link) do quadro do Trello abaixo.', 'const PROJETO = \'\';');
  if (!CONFIG.apiKey || !CONFIG.token) return falhar('Faltam as credenciais do Trello em CONFIG (apiKey e token).');

  $('#fail').classList.add('off');
  boot('Conectando ao Trello…');

  try {
    const quadro = await api('/boards/' + id, { fields:'name,desc,url,shortUrl,shortLink,dateLastActivity,closed' });
    boot('Lendo etapas e cartões…');

    const [listas, cartoes, etiquetas] = await Promise.all([
      api('/boards/' + id + '/lists',  { filter:'open', fields:'name,pos' }),
      api('/boards/' + id + '/cards',  {
        filter:'open',
        fields:'name,desc,due,start,dueComplete,idList,labels,shortUrl,url,pos,badges,idMembers',
        checklists:'all', checklist_fields:'name',
        members:'true', member_fields:'fullName,initials',
        customFieldItems:'true',
      }),
      api('/boards/' + id + '/labels', { fields:'name,color', limit:'1000' }).catch(() => []),
    ]);

    let campos = [];
    try { campos = await api('/boards/' + id + '/customFields', {}); } catch(e){ campos = []; }

    S.dados = normalizar({ quadro, listas, cartoes, etiquetas, campos });
    if (!S.abertas.size){
      const atual = S.dados.listas.find(l => l.cartoes.length && l.pct < 100) || S.dados.listas[0];
      if (atual) S.abertas.add(atual.id);
    }
    renderTudo();
    $('#boot').classList.add('off');
    document.title = (CONFIG.titulo || quadro.name || 'Painel do Projeto');
  } catch (err){
    let msg = 'Erro ao falar com a API do Trello.';
    if (err.status === 400) msg = 'ID de quadro inválido (400). Confira o ID copiado da URL do Trello — é a parte depois de /b/.';
    else if (err.status === 401) msg = 'Credenciais recusadas (401). Verifique apiKey e token em CONFIG — o token pode ter expirado.';
    else if (err.status === 404) msg = 'Quadro não encontrado (404). Confira o ID e se o token tem acesso a ele.';
    else if (err.status === 429) msg = 'Muitas requisições (429). Aguarde alguns segundos e recarregue.';
    else if (err.message === 'Failed to fetch') msg = 'Sem resposta da API. Verifique a conexão / proxy da rede.';
    falhar(msg + '\n\nQuadro solicitado: ' + id, err.corpo ? String(err.corpo).slice(0,300) : null);
    console.error(err);
  }
}

/* ═════════════ NORMALIZAÇÃO (adaptativa: nada é assumido) ═════════════ */
// Palavras que, no nome de uma COLUNA ou de uma ETIQUETA, indicam trabalho encerrado.
// É o único "palpite" que o painel dá — e ele é mostrado na aba Sobre.
const RX_FEITO = /(conclu[ií]|finaliz|entregue|encerrad|feito|pronto|done|complete|aprovad)/i;

function normalizar(raw){
  // Só entra o que está ativo no quadro. Colunas arquivadas não vêm da API (filter=open)
  // e os cartões que moram dentro delas são descartados logo abaixo.
  const listas = (raw.listas || []).slice().sort((a,b) => a.pos - b.pos)
    .map((l,i) => ({ id:l.id, nome:l.name, indice:i+1 }));
  const porId = {};
  listas.forEach(l => porId[l.id] = l);

  const colunasFeitas = new Set(listas.filter(l => RX_FEITO.test(l.nome)).map(l => l.id));
  const etiquetasFeitas = new Set((raw.etiquetas || []).filter(l => l.name && RX_FEITO.test(l.name)).map(l => l.id));

  const defCampos = {};
  (raw.campos || []).forEach(f => {
    defCampos[f.id] = {
      nome: f.name,
      tipo: f.type,
      opcoes: (f.options || []).reduce((a,o) => (a[o.id] = (o.value && o.value.text) || '', a), {}),
    };
  });

  const cartoes = (raw.cartoes || []).filter(c => porId[c.idList]).map(c => {
    let feitos = 0, total = 0;
    const checklists = (c.checklists || []).map(cl => {
      const itens = (cl.checkItems || [])
        .slice().sort((a,b) => a.pos - b.pos)
        .map(i => ({ nome:i.name, feito:i.state === 'complete' }));
      feitos += itens.filter(i => i.feito).length;
      total  += itens.length;
      return { nome:cl.name, itens };
    });

    const campos = (c.customFieldItems || []).map(it => {
      const d = defCampos[it.idCustomField];
      if (!d) return null;
      const v = it.value || {};
      let valor = '';
      if (it.idValue) valor = d.opcoes[it.idValue] || '';
      else if (v.text !== undefined) valor = v.text;
      else if (v.number !== undefined) valor = v.number;
      else if (v.date !== undefined) valor = dataBR(v.date);
      else if (v.checked !== undefined) valor = (v.checked === 'true' ? 'Sim' : 'Não');
      if (valor === '' || valor == null) return null;
      return { nome:d.nome, valor:String(valor) };
    }).filter(Boolean);

    const lista = porId[c.idList];
    const card = {
      id: c.id,
      nome: c.name || '(sem título)',
      desc: c.desc || '',
      due: c.due || null,
      start: c.start || null,
      dueComplete: c.dueComplete === true,
      idLista: c.idList,
      lista: lista.nome,
      etiquetas: (c.labels || []).map(l => ({ id:l.id, nome:l.name || '', cor:l.color || null })),
      membros: (c.members || []).map(m => m.fullName || m.initials || ''),
      checklists, chkFeitos:feitos, chkTotal:total,
      campos,
      comentarios: (c.badges && c.badges.comments) || 0,
      anexos: (c.badges && c.badges.attachments) || 0,
      url: c.shortUrl || c.url || '',
      pos: c.pos,
    };
    card.status = derivarStatus(card, colunasFeitas, etiquetasFeitas);
    return card;
  }).sort((a,b) => a.pos - b.pos);

  // etiquetas do quadro + qualquer uma que apareça só nos cartões
  const mapaEtq = {};
  (raw.etiquetas || []).forEach(l => mapaEtq[l.id] = { id:l.id, nome:l.name || '', cor:l.color || null });
  cartoes.forEach(c => c.etiquetas.forEach(l => { if (!mapaEtq[l.id]) mapaEtq[l.id] = l; }));

  const etiquetas = Object.values(mapaEtq).map(l => {
    const usados = cartoes.filter(c => c.etiquetas.some(x => x.id === l.id));
    return Object.assign({}, l, { total:usados.length, feitos:usados.filter(c => c.status === 'ok').length });
  }).filter(l => l.total > 0 || l.nome)
    .sort((a,b) => b.total - a.total || a.nome.localeCompare(b.nome));

  listas.forEach(l => {
    l.cartoes = cartoes.filter(c => c.idLista === l.id);
    l.feitos  = l.cartoes.filter(c => c.status === 'ok').length;
    l.pct     = l.cartoes.length ? Math.round(l.feitos / l.cartoes.length * 100) : 0;
    const datas = l.cartoes.filter(c => c.due).map(c => new Date(c.due));
    if (!datas.length) l.periodo = null;
    else {
      const ini = dataBR(new Date(Math.min.apply(null, datas)));
      const fim = dataBR(new Date(Math.max.apply(null, datas)));
      l.periodo = ini === fim ? ini : ini + ' – ' + fim;
    }
  });

  const contagem = {};
  ORDEM_STATUS.forEach(k => contagem[k] = cartoes.filter(c => c.status === k).length);

  return {
    quadro: raw.quadro,
    listas, cartoes, etiquetas, contagem,
    colunasFeitas, etiquetasFeitas,
    campos: raw.campos || [],
    total: cartoes.length,
    feitos: contagem.ok,
    pct: cartoes.length ? Math.round(contagem.ok / cartoes.length * 100) : 0,
  };
}

function derivarStatus(c, colunasFeitas, etiquetasFeitas){
  if (c.dueComplete) return 'ok';
  if (colunasFeitas.has(c.idLista)) return 'ok';
  if (c.etiquetas.some(l => etiquetasFeitas.has(l.id))) return 'ok';
  if (c.chkTotal > 0 && c.chkFeitos === c.chkTotal) return 'ok';
  if (!c.due) return 'none';
  const n = diasAte(c.due);
  if (n < 0) return 'late';
  if (c.start && new Date(c.start).setHours(0,0,0,0) <= HOJE.getTime()) return 'run';
  if (n <= 7) return 'run';
  return 'plan';
}

      '<div><div class="alert-t">' + plural(d.contagem.late,'cartão com prazo vencido','cartões com prazo vencido') + '</div>' +
      '<div class="alert-d">Toque em “Ver detalhamento completo” e filtre por Atrasados.</div></div></div>'

/* ═════════════ RENDER: DETALHE ═════════════ */
function filtrados(lista){
  const q = S.q.trim().toLowerCase();
  return lista.filter(c => {
    if (S.filtro !== 'todos' && c.status !== S.filtro) return false;
    if (S.etiqueta === '__sem__' && c.etiquetas.length) return false;
    if (S.etiqueta && S.etiqueta !== '__sem__' && !c.etiquetas.some(l => l.id === S.etiqueta)) return false;
    if (q){
      const alvo = (c.nome + ' ' + c.desc + ' ' + c.lista + ' ' +
        c.etiquetas.map(l => l.nome).join(' ') + ' ' +
        c.campos.map(f => f.nome + ' ' + f.valor).join(' ')).toLowerCase();
      if (!alvo.includes(q)) return false;
    }
    return true;
  });
}

function renderPrazos(){
  const todos = filtrados(S.dados.cartoes);
  const comData = todos.filter(c => c.due).sort((a,b) => new Date(a.due) - new Date(b.due));
  const semData = todos.filter(c => !c.due);

  const grupos = [];
  comData.forEach(c => {
    const m = mesAno(c.due);
    if (!grupos.length || grupos[grupos.length-1].mes !== m) grupos.push({ mes:m, itens:[] });
    grupos[grupos.length-1].itens.push(c);
  });

  const marcoHoje = '<div class="today-line"><i></i><span>Hoje &middot; ' + esc(dataBR(HOJE)) + '</span><i></i></div>';
  let h = '', marcou = false;

  grupos.forEach(g => {
    h += '<div class="tl-month">' + esc(g.mes) + '</div><div class="tl-list">';
    g.itens.forEach(c => {
      if (!marcou && diasAte(c.due) >= 0){ h += marcoHoje; marcou = true; }
      const cls = c.status === 'ok' ? 'ok' : (c.status === 'late' ? 'late' : '');
      const dt = dataBR(c.due), rel = textoPrazo(c.due);
      h += '<button class="tl-item ' + cls + '" data-card="' + c.id + '">' +
        '<span class="tl-d">' + esc(dt) +
          (c.status === 'ok' || rel === dt ? '' : ' &middot; ' + esc(rel)) + '</span>' +
        '<span class="tl-n ' + (c.status === 'ok' ? 'done' : '') + '">' + esc(c.nome) + '</span>' +
        (c.lista ? '<span class="tl-c">' + esc(c.lista) + '</span>' : '') +
      '</button>';
    });
    h += '</div>';
  });
  if (comData.length && !marcou) h += marcoHoje;

  if (semData.length){
    h += '<div class="tl-month">Sem data definida</div>' +
         '<div class="card" style="margin-top:4px">' + semData.map(htmlTarefa).join('') + '</div>';
  }

  $('#tab-prazos').innerHTML = h || vazio('Nenhum cartão para exibir com esses filtros.');
}

function renderEtiquetas(){
  const d = S.dados;
  const semEtq = d.cartoes.filter(c => !c.etiquetas.length).length;
  let h = '<div class="card"><div class="card-head"><div class="card-title">Etiquetas do quadro</div>' +
          '<div class="card-meta">' + d.etiquetas.length + '</div></div>';

  if (!d.etiquetas.length){
    h += vazio('Este quadro não usa etiquetas.');
  } else {
    h += d.etiquetas.map(l => {
      const pct = l.total ? Math.round(l.feitos / l.total * 100) : 0;
      return '<button class="col-item" style="width:100%;text-align:left;display:block" data-etq="' + l.id + '">' +
        '<div class="col-top"><div class="col-name">' +
          (l.cor ? '<i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + corEtiqueta(l.cor) + ';margin-right:7px"></i>' : '') +
          esc(l.nome || '(etiqueta ' + (l.cor || 'sem nome') + ')') + '</div>' +
        '<div class="col-num">' + l.feitos + '/' + l.total + '</div></div>' +
        '<div class="bar"><i data-w="' + pct + '"></i></div>' +
      '</button>';
    }).join('');
  }
  h += '</div>';

  if (semEtq){
    h += '<button class="btn ghost" data-etq="__sem__">' + plural(semEtq,'cartão sem etiqueta','cartões sem etiqueta') + '</button>';
  }
  $('#tab-etiquetas').innerHTML = h;
  requestAnimationFrame(() => $$('#tab-etiquetas .bar i').forEach(i => i.style.width = i.dataset.w + '%'));
}

function renderSobre(){
  const d = S.dados, q = d.quadro;
  const linhas = [
    ['Quadro', q.name || '—'],
    ['ID', idAtual()],
    ['Etapas', d.listas.length],
    ['Cartões abertos', d.total],
    ['Etiquetas', d.etiquetas.length],
    ['Campos personalizados', d.campos.length],
    ['Última atividade', q.dateLastActivity ? dataBR(q.dateLastActivity) : '—'],
  ];
  let h = '';

  if (q.desc){
    h += '<div class="card"><div class="card-head"><div class="card-title">Descrição do quadro</div></div>' +
         '<div class="prose">' + md(q.desc) + '</div></div>';
  }

  h += '<div class="card"><div class="card-head"><div class="card-title">Dados do quadro</div></div>' +
       linhas.map(l => '<div class="kv"><b>' + esc(l[0]) + '</b><span>' + esc(l[1]) + '</span></div>').join('') +
       '</div>';

  const regras = [
    'o prazo está marcado como cumprido no Trello',
    'todos os itens das suas checklists estão marcados',
  ];
  const cols = d.listas.filter(l => d.colunasFeitas.has(l.id)).map(l => l.nome);
  const etqs = d.etiquetas.filter(l => d.etiquetasFeitas.has(l.id)).map(l => l.nome);
  if (cols.length) regras.push('ele está numa coluna de encerramento detectada pelo nome (<strong>' + esc(cols.join(', ')) + '</strong>)');
  if (etqs.length) regras.push('ele tem uma etiqueta de encerramento detectada pelo nome (<strong>' + esc(etqs.join(', ')) + '</strong>)');
  h += '<div class="card"><div class="card-head"><div class="card-title">Como o progresso é calculado</div></div>' +
    '<div class="prose"><p>Um cartão conta como <strong>concluído</strong> quando qualquer uma destas condições é verdadeira:</p>' +
    '<ul>' + regras.map(r => '<li>' + r + '</li>').join('') + '</ul>' +
    '<p>Nada mais é presumido: colunas, etiquetas e descrições são lidas exatamente como estão no quadro.</p></div></div>';

  h += '<div class="card"><div class="card-head"><div class="card-title">Trocar de quadro</div></div>' +
    '<div class="field"><input id="troca-input" type="text" value="' + esc(idAtual()) + '" placeholder="ID ou link do quadro" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<button id="troca-go">Abrir</button></div>' +
    '<div class="prose" style="margin-top:10px;font-size:12.5px">Isso abre o painel com outro quadro sem alterar o código. ' +
    'Para fixar de vez, edite a constante <code>PROJETO</code> no topo do arquivo.</div></div>';

  if (q.shortUrl || q.url){
    h += '<a class="btn ghost" href="' + esc(q.shortUrl || q.url) + '" target="_blank" rel="noopener">Abrir quadro no Trello</a>';
  }
  $('#tab-sobre').innerHTML = h;
}

function renderDetalhe(){
  renderChips();
  if (S.tab === 'quadro')    renderQuadro();
  if (S.tab === 'prazos')    renderPrazos();
  if (S.tab === 'etiquetas') renderEtiquetas();
  if (S.tab === 'sobre')     renderSobre();
}

function renderTudo(){ renderResumo(); renderDetalhe(); }

/* ═════════════ SHEET DO CARTÃO ═════════════ */
function abrirCard(id){
  const c = S.dados.cartoes.find(x => x.id === id);
  if (!c) return;
  const s = STATUS[c.status];

  $('#sheet-eyebrow').innerHTML = esc(c.lista || 'Cartão') + ' &nbsp;·&nbsp; ' + s.rot;
  $('#sheet-title').textContent = c.nome;

  let h = '';
  if (c.etiquetas.length){
    h += '<div class="blk"><div class="blk-t">Etiquetas</div><div class="task-foot" style="margin:0">' +
         c.etiquetas.map(chipEtiqueta).join('') + '</div></div>';
  }

  const kv = [];
  kv.push(['Situação', s.rot]);
  if (c.start) kv.push(['Início', dataBR(c.start)]);
  if (c.due)   kv.push(['Prazo', dataBR(c.due) + (c.status === 'ok' ? '' : ' (' + textoPrazo(c.due) + ')')]);
  if (!c.due)  kv.push(['Prazo', 'Não definido']);
  if (c.lista) kv.push(['Etapa', c.lista]);
  if (c.membros.length) kv.push(['Responsáveis', c.membros.join(', ')]);
  if (c.chkTotal) kv.push(['Checklists', c.chkFeitos + ' de ' + c.chkTotal + ' itens']);
  if (c.anexos) kv.push(['Anexos', String(c.anexos)]);
  if (c.comentarios) kv.push(['Comentários', String(c.comentarios)]);
  c.campos.forEach(f => kv.push([f.nome, f.valor]));

  h += '<div class="blk"><div class="blk-t">Informações</div>' +
       kv.map(r => '<div class="kv"><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></div>').join('') + '</div>';

  if (c.desc){
    h += '<div class="blk"><div class="blk-t">Descrição</div><div class="prose">' + md(c.desc) + '</div></div>';
  }

  if (c.checklists.length){
    h += '<div class="blk"><div class="blk-t">Checklists</div>' + c.checklists.map(cl => {
      const f = cl.itens.filter(i => i.feito).length;
      return '<div class="chk"><div class="chk-h"><div>' + esc(cl.nome) + '</div><span>' + f + '/' + cl.itens.length + '</span></div>' +
        cl.itens.map(i => '<div class="chk-i ' + (i.feito ? 'done' : '') + '"><i></i><span>' + esc(i.nome) + '</span></div>').join('') +
      '</div>';
    }).join('') + '</div>';
  }

  if (c.url){
    h += '<a class="btn ghost" href="' + esc(c.url) + '" target="_blank" rel="noopener" style="margin:0">Abrir cartão no Trello</a>';
  }

  $('#sheet-body').innerHTML = h;
  $('#sheet-body').scrollTop = 0;
  $('#sheet').classList.add('on');
  $('#sheet-bg').classList.add('on');
  document.body.style.overflow = 'hidden';
  history.pushState({ sheet:1 }, '');
}
function fecharCard(voltar){
  if (!$('#sheet').classList.contains('on')) return;
  $('#sheet').classList.remove('on');
  $('#sheet-bg').classList.remove('on');
  document.body.style.overflow = '';
  if (voltar !== false && history.state && history.state.sheet) history.back();
}

/* ═════════════ NAVEGAÇÃO ═════════════ */
function irPara(v){
  S.view = v;
  $('#view-resumo').classList.toggle('on', v === 'resumo');
  $('#view-detalhe').classList.toggle('on', v === 'detalhe');
  $$('[data-goto]').forEach(b => b.setAttribute('aria-current', String(b.dataset.goto === v)));
  window.scrollTo(0, 0);
}
function irTab(t){
  S.tab = t;
  $$('#seg button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  ['quadro','prazos','etiquetas','sobre'].forEach(k => $('#tab-' + k).hidden = (k !== t));
  renderDetalhe();
}

/* ═════════════ EVENTOS ═════════════ */
document.addEventListener('click', e => {
  const t = e.target;

  const nav = t.closest('[data-goto]');
  if (nav) return irPara(nav.dataset.goto);

  const tab = t.closest('#seg button');
  if (tab) return irTab(tab.dataset.tab);

  const card = t.closest('[data-card]');
  if (card) return abrirCard(card.dataset.card);

  const acc = t.closest('[data-toggle]');
  if (acc){
    const sec = acc.closest('.acc');
    sec.classList.toggle('open');
    if (sec.classList.contains('open')) S.abertas.add(acc.dataset.toggle);
    else S.abertas.delete(acc.dataset.toggle);
    const b = sec.querySelector('.acc-bar i');
    if (b) requestAnimationFrame(() => b.style.width = b.dataset.w + '%');
    return;
  }

  const chip = t.closest('[data-filtro]');
  if (chip){ S.filtro = chip.dataset.filtro; return renderDetalhe(); }

  if (t.closest('[data-limpar-etq]')){ S.etiqueta = null; return renderDetalhe(); }

  const etq = t.closest('[data-etq]');
  if (etq){ S.etiqueta = etq.dataset.etq; irTab('quadro'); return; }

  if (t.closest('#sheet-bg')) return fecharCard();
  if (t.closest('#btn-detalhe')) return irPara('detalhe');
  if (t.closest('#link-prazos')){ irPara('detalhe'); return irTab('prazos'); }

  if (t.closest('#troca-go')){
    const v = extrairId($('#troca-input').value);
    if (v) location.search = '?p=' + v;
    return;
  }
  if (t.closest('#fail-go')){
    const v = extrairId($('#fail-input').value);
    if (v) location.search = '?p=' + v;
    return;
  }
  if (t.closest('#btn-reload')){
    $('#btn-reload').classList.add('spin');
    return carregar().finally(() => $('#btn-reload').classList.remove('spin'));
  }
});

$('#q').addEventListener('input', e => {
  S.q = e.target.value;
  $('#q-clear').classList.toggle('on', !!S.q);
  clearTimeout($('#q')._t);
  $('#q')._t = setTimeout(renderDetalhe, 160);
});
$('#q-clear').addEventListener('click', () => {
  $('#q').value = ''; S.q = ''; $('#q-clear').classList.remove('on'); renderDetalhe();
});
$('#fail-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('#fail-go').click(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharCard(); });
window.addEventListener('popstate', () => fecharCard(false));

/* ═════════════ INÍCIO ═════════════ */
carregar().then(() => {
  if (CONFIG.recarregarACada > 0){
    setInterval(() => { if (!$('#sheet').classList.contains('on')) carregar(); }, CONFIG.recarregarACada * 1000);
  }
});
</script>
